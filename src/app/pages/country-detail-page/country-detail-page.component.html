@if (view$ | async; as view) {
  @if (view.state === 'loaded') {
    <div class="grid">
      <app-header [title]="view.title" [indicators]="view.indicators" />
      <app-chart class="grid-main" type="line" showDescription unit="medals" [items]="view.chartItems"
        description="Medals per edition" />
      <a class="button back" routerLink="/">Back to dashboard</a>
    </div>
  } @else if (view.state === 'loading') {
    <app-page-skeleton [cards]="3" caption backButton />
  } @else {
    <app-page-status [state]="view.state" backLink />
  }
}
