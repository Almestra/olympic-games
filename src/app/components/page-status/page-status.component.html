<div class="page-status" [class.is-loading]="state === 'loading'" role="status">
  @if (state === 'loading') {
    <span class="spinner" aria-hidden="true"></span>
  }
  <p>{{ text }}</p>
  @if (backLink && state !== 'loading') {
    <a class="button" routerLink="/">Back to dashboard</a>
  }
</div>
